<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="iris-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="iris-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F33"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
    <filter id="iris-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="600" height="380" rx="16" fill="url(#iris-bg)" stroke="#23304E" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="18" width="560" height="42" rx="8" fill="#141D30" stroke="#2D3A58" stroke-width="1"/>
  <circle cx="42" cy="39" r="6" fill="#EF4444"/>
  <circle cx="60" cy="39" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="39" r="6" fill="#10B981"/>
  <text x="105" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">IRIS SPECIES CLASSIFIER // SCIKIT-LEARN & ML</text>
  <rect x="440" y="27" width="125" height="24" rx="12" fill="#1E2B45" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="454" cy="39" r="4" fill="#A78BFA" filter="url(#iris-glow)"/>
  <text x="466" y="43" font-family="sans-serif" font-size="10" fill="#A78BFA">MODEL TRAINED</text>

  <!-- Left Main Scatter Plot Canvas -->
  <rect x="20" y="74" width="370" height="286" rx="10" fill="url(#iris-panel)" stroke="#273552" stroke-width="1"/>
  <text x="36" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#55E6D1">DECISION BOUNDARIES // PETAL LENGTH vs WIDTH</text>

  <!-- Plot Axis Lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="60" y1="320" x2="360" y2="320"/>
    <line x1="60" y1="120" x2="60" y2="320"/>
  </g>
  <!-- Grid sub lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="260" x2="360" y2="260"/>
    <line x1="60" y1="200" x2="360" y2="200"/>
    <line x1="60" y1="140" x2="360" y2="140"/>
    <line x1="135" y1="120" x2="135" y2="320"/>
    <line x1="210" y1="120" x2="210" y2="320"/>
    <line x1="285" y1="120" x2="285" y2="320"/>
  </g>

  <!-- Decision Boundary Areas (Subtle fills) -->
  <path d="M60 320 L150 320 L150 120 L60 120 Z" fill="#55E6D1" fill-opacity="0.08"/>
  <path d="M150 320 L270 320 L240 120 L150 120 Z" fill="#A78BFA" fill-opacity="0.08"/>
  <path d="M270 320 L360 320 L360 120 L240 120 Z" fill="#F472B6" fill-opacity="0.08"/>

  <!-- Decision Separator Lines -->
  <path d="M150 320 L150 120" stroke="#55E6D1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M270 320 L240 120" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Cluster 1: Setosa (Cyan) -->
  <g fill="#55E6D1" filter="url(#iris-glow)">
    <circle cx="85" cy="290" r="4.5"/>
    <circle cx="95" cy="275" r="4"/>
    <circle cx="110" cy="285" r="4.5"/>
    <circle cx="102" cy="300" r="4"/>
    <circle cx="125" cy="270" r="4.5"/>
    <circle cx="130" cy="290" r="4"/>
    <circle cx="118" cy="260" r="4.5"/>
  </g>

  <!-- Cluster 2: Versicolor (Violet) -->
  <g fill="#A78BFA" filter="url(#iris-glow)">
    <circle cx="175" cy="235" r="4.5"/>
    <circle cx="185" cy="210" r="4"/>
    <circle cx="198" cy="225" r="4.5"/>
    <circle cx="210" cy="205" r="4"/>
    <circle cx="225" cy="215" r="4.5"/>
    <circle cx="205" cy="245" r="4"/>
    <circle cx="238" cy="230" r="4.5"/>
  </g>

  <!-- Cluster 3: Virginica (Pink) -->
  <g fill="#F472B6" filter="url(#iris-glow)">
    <circle cx="265" cy="180" r="4.5"/>
    <circle cx="280" cy="160" r="4"/>
    <circle cx="295" cy="175" r="4.5"/>
    <circle cx="310" cy="150" r="4"/>
    <circle cx="325" cy="165" r="4.5"/>
    <circle cx="300" cy="190" r="4"/>
    <circle cx="335" cy="140" r="4.5"/>
  </g>

  <!-- Labels -->
  <text x="75" y="340" font-family="sans-serif" font-size="10" fill="#55E6D1">Iris-setosa</text>
  <text x="175" y="340" font-family="sans-serif" font-size="10" fill="#A78BFA">Iris-versicolor</text>
  <text x="280" y="340" font-family="sans-serif" font-size="10" fill="#F472B6">Iris-virginica</text>

  <!-- Right Side: Model Metrics & Confusion Matrix -->
  <!-- Accuracy Card -->
  <rect x="405" y="74" width="175" height="100" rx="10" fill="url(#iris-panel)" stroke="#273552" stroke-width="1"/>
  <text x="420" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">TEST ACCURACY</text>
  <text x="420" y="136" font-family="sans-serif" font-size="28" font-weight="700" fill="#55E6D1">98.6%</text>
  <text x="420" y="156" font-family="sans-serif" font-size="10" fill="#34D399">▲ Supervised Classifier</text>

  <!-- Matrix / Features Card -->
  <rect x="405" y="186" width="175" height="174" rx="10" fill="url(#iris-panel)" stroke="#273552" stroke-width="1"/>
  <text x="420" y="210" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A78BFA">FEATURE WEIGHTS</text>

  <text x="420" y="234" font-family="sans-serif" font-size="10" fill="#F1F5F9">Petal Length</text>
  <rect x="420" y="240" width="145" height="8" rx="4" fill="#1E293B"/>
  <rect x="420" y="240" width="132" height="8" rx="4" fill="#55E6D1"/>

  <text x="420" y="266" font-family="sans-serif" font-size="10" fill="#F1F5F9">Petal Width</text>
  <rect x="420" y="272" width="145" height="8" rx="4" fill="#1E293B"/>
  <rect x="420" y="272" width="118" height="8" rx="4" fill="#A78BFA"/>

  <text x="420" y="298" font-family="sans-serif" font-size="10" fill="#F1F5F9">Sepal Length</text>
  <rect x="420" y="304" width="145" height="8" rx="4" fill="#1E293B"/>
  <rect x="420" y="304" width="65" height="8" rx="4" fill="#60A5FA"/>

  <text x="420" y="330" font-family="sans-serif" font-size="10" fill="#F1F5F9">Sepal Width</text>
  <rect x="420" y="336" width="145" height="8" rx="4" fill="#1E293B"/>
  <rect x="420" y="336" width="45" height="8" rx="4" fill="#94A3B8"/>
</svg>
