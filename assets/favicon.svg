<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="fav-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#55E6D1"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded hexagon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" stroke="url(#fav-accent)" stroke-width="2"/>
  
  <!-- Robot Head Outline -->
  <rect x="15" y="19" width="34" height="26" rx="8" fill="#151C2E" stroke="#A78BFA" stroke-width="1.5"/>
  
  <!-- Visor -->
  <rect x="19" y="24" width="26" height="12" rx="4" fill="#080B12" stroke="#55E6D1" stroke-width="1"/>
  
  <!-- Cyan Glowing Eyes -->
  <circle cx="26" cy="30" r="3" fill="#55E6D1" filter="url(#fav-glow)"/>
  <circle cx="38" cy="30" r="3" fill="#55E6D1" filter="url(#fav-glow)"/>
  <circle cx="27" cy="29" r="1" fill="#FFFFFF"/>
  <circle cx="39" cy="29" r="1" fill="#FFFFFF"/>
  
  <!-- Antenna -->
  <line x1="32" y1="19" x2="32" y2="10" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3" fill="#55E6D1" filter="url(#fav-glow)"/>
  
  <!-- Ear Nodes -->
  <rect x="11" y="27" width="4" height="10" rx="2" fill="#55E6D1"/>
  <rect x="49" y="27" width="4" height="10" rx="2" fill="#55E6D1"/>
  
  <!-- Neck/Chassis base -->
  <path d="M25 45 L39 45 L43 53 L21 53 Z" fill="#1C2438" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="32" cy="49" r="2" fill="#55E6D1"/>
</svg>
