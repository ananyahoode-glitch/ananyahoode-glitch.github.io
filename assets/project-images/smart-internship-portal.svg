<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="sip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="sip-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#101726"/>
    </linearGradient>
    <linearGradient id="sip-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#55E6D1"/>
    </linearGradient>
    <filter id="sip-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="600" height="380" rx="16" fill="url(#sip-bg)" stroke="#23304E" stroke-width="2"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#55E6D1" stroke-width="0.5">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
  </g>

  <!-- Top App Bar -->
  <rect x="20" y="18" width="560" height="42" rx="8" fill="#141D30" stroke="#2D3A58" stroke-width="1"/>
  <circle cx="42" cy="39" r="6" fill="#EF4444"/>
  <circle cx="60" cy="39" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="39" r="6" fill="#10B981"/>
  <text x="105" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">SMART INTERNSHIP PORTAL // DJANGO CORE</text>
  <rect x="440" y="27" width="125" height="24" rx="12" fill="#1E2B45" stroke="#55E6D1" stroke-width="1"/>
  <circle cx="454" cy="39" r="4" fill="#55E6D1" filter="url(#sip-glow)"/>
  <text x="466" y="43" font-family="sans-serif" font-size="10" fill="#55E6D1">PORTAL ACTIVE</text>

  <!-- Left Sidebar / Stats -->
  <rect x="20" y="74" width="165" height="286" rx="10" fill="url(#sip-card-grad)" stroke="#273552" stroke-width="1"/>
  <text x="36" y="102" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A78BFA">NAVIGATION</text>
  
  <rect x="30" y="116" width="145" height="32" rx="6" fill="#1F2C46" stroke="#55E6D1" stroke-width="1"/>
  <text x="46" y="137" font-family="sans-serif" font-size="11" fill="#F1F5F9">✦ All Postings</text>
  
  <rect x="30" y="156" width="145" height="30" rx="6" fill="transparent"/>
  <text x="46" y="176" font-family="sans-serif" font-size="11" fill="#94A3B8">↳ Applications</text>

  <rect x="30" y="194" width="145" height="30" rx="6" fill="transparent"/>
  <text x="46" y="214" font-family="sans-serif" font-size="11" fill="#94A3B8">↳ Student Profiles</text>

  <rect x="30" y="232" width="145" height="30" rx="6" fill="transparent"/>
  <text x="46" y="252" font-family="sans-serif" font-size="11" fill="#94A3B8">↳ Recruiter Hub</text>

  <rect x="32" y="284" width="141" height="62" rx="6" fill="#0C121E" stroke="#2D3C5C" stroke-width="1"/>
  <text x="42" y="304" font-family="sans-serif" font-size="10" fill="#94A3B8">MATCH RATE</text>
  <text x="42" y="332" font-family="sans-serif" font-size="20" font-weight="700" fill="#55E6D1">92.4%</text>

  <!-- Main Content Dashboard -->
  <!-- Top Stat Cards -->
  <rect x="200" y="74" width="180" height="78" rx="8" fill="url(#sip-card-grad)" stroke="#273552" stroke-width="1"/>
  <text x="216" y="98" font-family="sans-serif" font-size="11" fill="#94A3B8">Total Openings</text>
  <text x="216" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#F1F5F9">148</text>
  <path d="M330 130 L345 110 L360 118 L370 100" fill="none" stroke="#55E6D1" stroke-width="2"/>

  <rect x="395" y="74" width="185" height="78" rx="8" fill="url(#sip-card-grad)" stroke="#273552" stroke-width="1"/>
  <text x="411" y="98" font-family="sans-serif" font-size="11" fill="#94A3B8">Candidate Stream</text>
  <text x="411" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#A78BFA">1,240</text>
  <path d="M525 130 L540 120 L555 105 L565 95" fill="none" stroke="#A78BFA" stroke-width="2"/>

  <!-- Application Funnel & Candidates -->
  <rect x="200" y="166" width="380" height="194" rx="10" fill="url(#sip-card-grad)" stroke="#273552" stroke-width="1"/>
  <text x="218" y="194" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">RECENT CANDIDATE SUBMISSIONS</text>

  <!-- Table Row 1 -->
  <rect x="216" y="210" width="348" height="40" rx="6" fill="#141C2E" stroke="#1F2B44" stroke-width="1"/>
  <circle cx="236" cy="230" r="12" fill="#A78BFA"/>
  <text x="232" y="235" font-family="sans-serif" font-size="11" font-weight="700" fill="#080B12">AI</text>
  <text x="258" y="228" font-family="sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">AI / ML Intern Pipeline</text>
  <text x="258" y="242" font-family="sans-serif" font-size="10" fill="#94A3B8">Role: Computer Vision & NLP</text>
  <rect x="475" y="220" width="78" height="20" rx="10" fill="#059669" opacity="0.3"/>
  <text x="488" y="234" font-family="sans-serif" font-size="9" font-weight="600" fill="#34D399">APPROVED</text>

  <!-- Table Row 2 -->
  <rect x="216" y="258" width="348" height="40" rx="6" fill="#141C2E" stroke="#1F2B44" stroke-width="1"/>
  <circle cx="236" cy="278" r="12" fill="#55E6D1"/>
  <text x="231" y="283" font-family="sans-serif" font-size="11" font-weight="700" fill="#080B12">PY</text>
  <text x="258" y="276" font-family="sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Django Backend Developer</text>
  <text x="258" y="290" font-family="sans-serif" font-size="10" fill="#94A3B8">Role: REST APIs & Auth</text>
  <rect x="475" y="268" width="78" height="20" rx="10" fill="#D97706" opacity="0.3"/>
  <text x="488" y="282" font-family="sans-serif" font-size="9" font-weight="600" fill="#FBBF24">REVIEWING</text>

  <!-- Table Row 3 -->
  <rect x="216" y="306" width="348" height="40" rx="6" fill="#141C2E" stroke="#1F2B44" stroke-width="1"/>
  <circle cx="236" cy="326" r="12" fill="#60A5FA"/>
  <text x="232" y="331" font-family="sans-serif" font-size="11" font-weight="700" fill="#080B12">FS</text>
  <text x="258" y="324" font-family="sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Full-Stack Web Architect</text>
  <text x="258" y="338" font-family="sans-serif" font-size="10" fill="#94A3B8">Role: Responsive UI & DB</text>
  <rect x="475" y="316" width="78" height="20" rx="10" fill="#7C3AED" opacity="0.3"/>
  <text x="486" y="330" font-family="sans-serif" font-size="9" font-weight="600" fill="#C4B5FD">SCHEDULED</text>
</svg>
