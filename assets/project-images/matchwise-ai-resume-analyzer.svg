<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="mwa-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F33"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="mwa-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55E6D1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="mwa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="600" height="380" rx="16" fill="url(#mwa-bg)" stroke="#23304E" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="18" width="560" height="42" rx="8" fill="#141D30" stroke="#2D3A58" stroke-width="1"/>
  <circle cx="42" cy="39" r="6" fill="#EF4444"/>
  <circle cx="60" cy="39" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="39" r="6" fill="#10B981"/>
  <text x="105" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">MATCHWISE // AI RESUME ANALYZER &amp; NLP SCANNER</text>
  <rect x="440" y="27" width="125" height="24" rx="12" fill="#1E2B45" stroke="#55E6D1" stroke-width="1"/>
  <circle cx="454" cy="39" r="4" fill="#55E6D1" filter="url(#mwa-glow)"/>
  <text x="466" y="43" font-family="sans-serif" font-size="10" fill="#55E6D1">ATS OPTIMIZED</text>

  <!-- Left: Resume Document Preview &amp; Extracted Entities -->
  <rect x="20" y="74" width="260" height="286" rx="10" fill="url(#mwa-panel)" stroke="#273552" stroke-width="1"/>
  <text x="36" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A78BFA">CANDIDATE CV PARSER</text>

  <!-- Mini Resume Paper Graphic -->
  <rect x="36" y="115" width="228" height="230" rx="6" fill="#0A0E18" stroke="#1E2A42" stroke-width="1"/>
  <rect x="50" y="130" width="80" height="8" rx="2" fill="#F1F5F9"/>
  <rect x="50" y="144" width="130" height="5" rx="2" fill="#64748B"/>
  <rect x="50" y="153" width="110" height="5" rx="2" fill="#64748B"/>

  <!-- Scanning laser line -->
  <line x1="38" y1="185" x2="262" y2="185" stroke="#55E6D1" stroke-width="2" opacity="0.8" filter="url(#mwa-glow)"/>

  <!-- Parsed Highlights -->
  <text x="50" y="215" font-family="'JetBrains Mono', monospace" font-size="9" fill="#55E6D1">EXTRACTED SKILLS &amp; TOKENS:</text>

  <rect x="50" y="225" width="55" height="18" rx="4" fill="#164E63" stroke="#55E6D1" stroke-width="1"/>
  <text x="58" y="238" font-family="sans-serif" font-size="9" fill="#55E6D1">Python</text>

  <rect x="112" y="225" width="55" height="18" rx="4" fill="#3B0764" stroke="#A78BFA" stroke-width="1"/>
  <text x="120" y="238" font-family="sans-serif" font-size="9" fill="#C4B5FD">Django</text>

  <rect x="174" y="225" width="70" height="18" rx="4" fill="#1E293B" stroke="#60A5FA" stroke-width="1"/>
  <text x="180" y="238" font-family="sans-serif" font-size="9" fill="#93C5FD">PyTorch</text>

  <rect x="50" y="250" width="85" height="18" rx="4" fill="#1E293B" stroke="#55E6D1" stroke-width="1"/>
  <text x="58" y="263" font-family="sans-serif" font-size="9" fill="#55E6D1">Scikit-Learn</text>

  <rect x="142" y="250" width="102" height="18" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="1"/>
  <text x="148" y="263" font-family="sans-serif" font-size="9" fill="#C4B5FD">NLP Modeling</text>

  <rect x="50" y="285" width="200" height="45" rx="4" fill="#141C2E"/>
  <text x="60" y="302" font-family="sans-serif" font-size="9" fill="#94A3B8">JD Compatibility Match:</text>
  <text x="60" y="320" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399">✓ Highly Recommended</text>

  <!-- Right: Score Gauge &amp; Breakdown -->
  <rect x="295" y="74" width="285" height="286" rx="10" fill="url(#mwa-panel)" stroke="#273552" stroke-width="1"/>
  <text x="315" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#55E6D1">RELEVANCE TELEMETRY</text>

  <!-- Circular Match Dial -->
  <g transform="translate(437, 180)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#1E293B" stroke-width="10"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#mwa-circle)" stroke-width="10" stroke-dasharray="350" stroke-dashoffset="35" stroke-linecap="round" filter="url(#mwa-glow)"/>
    <text x="0" y="8" font-family="sans-serif" font-size="28" font-weight="800" fill="#F1F5F9" text-anchor="middle">94%</text>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#55E6D1" text-anchor="middle">ATS SCORE</text>
  </g>

  <!-- Breakdown Bars -->
  <g font-family="sans-serif" font-size="10" fill="#94A3B8">
    <text x="315" y="275">Technical Hard Skills</text>
    <text x="545" y="275" fill="#55E6D1">98%</text>
    <rect x="315" y="282" width="245" height="6" rx="3" fill="#1E293B"/>
    <rect x="315" y="282" width="240" height="6" rx="3" fill="#55E6D1"/>

    <text x="315" y="305">Experience &amp; Projects</text>
    <text x="545" y="305" fill="#A78BFA">92%</text>
    <rect x="315" y="312" width="245" height="6" rx="3" fill="#1E293B"/>
    <rect x="315" y="312" width="225" height="6" rx="3" fill="#A78BFA"/>

    <text x="315" y="335">Formatting &amp; Parseability</text>
    <text x="545" y="335" fill="#60A5FA">95%</text>
    <rect x="315" y="342" width="245" height="6" rx="3" fill="#1E293B"/>
    <rect x="315" y="342" width="232" height="6" rx="3" fill="#60A5FA"/>
  </g>
</svg>
