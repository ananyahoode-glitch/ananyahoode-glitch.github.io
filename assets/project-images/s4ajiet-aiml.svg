<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ajiet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="ajiet-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F33"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
    <filter id="ajiet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="600" height="380" rx="16" fill="url(#ajiet-bg)" stroke="#23304E" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="18" width="560" height="42" rx="8" fill="#141D30" stroke="#2D3A58" stroke-width="1"/>
  <circle cx="42" cy="39" r="6" fill="#EF4444"/>
  <circle cx="60" cy="39" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="39" r="6" fill="#10B981"/>
  <text x="105" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">AJIET AIML // SEMESTER 4 LABORATORY ALGORITHMS & ML WORKBENCH</text>
  <rect x="440" y="27" width="125" height="24" rx="12" fill="#1E2B45" stroke="#A78BFA" stroke-width="1"/>
  <circle cx="454" cy="39" r="4" fill="#A78BFA" filter="url(#ajiet-glow)"/>
  <text x="466" y="43" font-family="sans-serif" font-size="10" fill="#A78BFA">ACADEMIC REPO</text>

  <!-- Left: Neural Graph & Search Tree Algorithm -->
  <rect x="20" y="74" width="310" height="286" rx="10" fill="url(#ajiet-panel)" stroke="#273552" stroke-width="1"/>
  <text x="36" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#55E6D1">COMPUTATIONAL GRAPH // AI LAB</text>

  <!-- Neural / Search graph nodes -->
  <g stroke="#334155" stroke-width="1.5">
    <!-- Input to Hidden -->
    <line x1="75" y1="160" x2="160" y2="140" stroke="#55E6D1" opacity="0.6"/>
    <line x1="75" y1="160" x2="160" y2="200" stroke="#55E6D1" opacity="0.3"/>
    <line x1="75" y1="220" x2="160" y2="140" stroke="#55E6D1" opacity="0.4"/>
    <line x1="75" y1="220" x2="160" y2="200" stroke="#55E6D1" opacity="0.8"/>
    <line x1="75" y1="280" x2="160" y2="200" stroke="#55E6D1" opacity="0.5"/>
    <line x1="75" y1="280" x2="160" y2="260" stroke="#55E6D1" opacity="0.7"/>

    <!-- Hidden to Output -->
    <line x1="160" y1="140" x2="250" y2="175" stroke="#A78BFA" opacity="0.8"/>
    <line x1="160" y1="200" x2="250" y2="175" stroke="#A78BFA" opacity="0.9"/>
    <line x1="160" y1="260" x2="250" y2="235" stroke="#A78BFA" opacity="0.7"/>
    <line x1="160" y1="200" x2="250" y2="235" stroke="#A78BFA" opacity="0.5"/>
  </g>

  <!-- Input Nodes -->
  <circle cx="75" cy="160" r="14" fill="#0E2135" stroke="#55E6D1" stroke-width="2"/>
  <text x="75" y="164" font-family="'JetBrains Mono', monospace" font-size="9" fill="#55E6D1" text-anchor="middle">X₁</text>

  <circle cx="75" cy="220" r="14" fill="#0E2135" stroke="#55E6D1" stroke-width="2"/>
  <text x="75" y="224" font-family="'JetBrains Mono', monospace" font-size="9" fill="#55E6D1" text-anchor="middle">X₂</text>

  <circle cx="75" cy="280" r="14" fill="#0E2135" stroke="#55E6D1" stroke-width="2"/>
  <text x="75" y="284" font-family="'JetBrains Mono', monospace" font-size="9" fill="#55E6D1" text-anchor="middle">X₃</text>

  <!-- Hidden Nodes -->
  <circle cx="160" cy="140" r="14" fill="#1C1838" stroke="#A78BFA" stroke-width="2"/>
  <text x="160" y="144" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA" text-anchor="middle">H₁</text>

  <circle cx="160" cy="200" r="14" fill="#1C1838" stroke="#A78BFA" stroke-width="2"/>
  <text x="160" y="204" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA" text-anchor="middle">H₂</text>

  <circle cx="160" cy="260" r="14" fill="#1C1838" stroke="#A78BFA" stroke-width="2"/>
  <text x="160" y="264" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A78BFA" text-anchor="middle">H₃</text>

  <!-- Output Nodes -->
  <circle cx="250" cy="175" r="16" fill="#0B3029" stroke="#34D399" stroke-width="2" filter="url(#ajiet-glow)"/>
  <text x="250" y="179" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Y₁</text>

  <circle cx="250" cy="235" r="16" fill="#0B3029" stroke="#34D399" stroke-width="2" filter="url(#ajiet-glow)"/>
  <text x="250" y="239" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Y₂</text>

  <text x="75" y="330" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Inputs</text>
  <text x="160" y="330" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Hidden Layer</text>
  <text x="250" y="330" font-family="sans-serif" font-size="10" fill="#34D399" text-anchor="middle">Class Output</text>

  <!-- Right: Lab Experiments Index & Code Metrics -->
  <rect x="345" y="74" width="235" height="286" rx="10" fill="url(#ajiet-panel)" stroke="#273552" stroke-width="1"/>
  <text x="360" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A78BFA">LAB MODULES & ALGORITHMS</text>

  <!-- Module Cards -->
  <g transform="translate(360, 116)">
    <!-- Lab 1 -->
    <rect x="0" y="0" width="205" height="42" rx="6" fill="#131B2D" stroke="#1F2A42" stroke-width="1"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#55E6D1">LAB-01 // A* & BFS SEARCH</text>
    <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#94A3B8">Heuristic graph traversal & cost analysis</text>

    <!-- Lab 2 -->
    <rect x="0" y="52" width="205" height="42" rx="6" fill="#131B2D" stroke="#1F2A42" stroke-width="1"/>
    <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A78BFA">LAB-02 // CANDIDATE ELIMINATION</text>
    <text x="12" y="84" font-family="sans-serif" font-size="9" fill="#94A3B8">Version space concept learning</text>

    <!-- Lab 3 -->
    <rect x="0" y="104" width="205" height="42" rx="6" fill="#131B2D" stroke="#1F2A42" stroke-width="1"/>
    <text x="12" y="122" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#60A5FA">LAB-03 // DECISION TREE (ID3)</text>
    <text x="12" y="136" font-family="sans-serif" font-size="9" fill="#94A3B8">Entropy & Information Gain calculation</text>

    <!-- Lab 4 -->
    <rect x="0" y="156" width="205" height="42" rx="6" fill="#131B2D" stroke="#1F2A42" stroke-width="1"/>
    <text x="12" y="174" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34D399">LAB-04 // BACKPROPAGATION ANN</text>
    <text x="12" y="188" font-family="sans-serif" font-size="9" fill="#94A3B8">Gradient descent & weight adjustments</text>
  </g>
</svg>
